services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: astro-components-dev
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    stdin_open: true
    tty: true

  mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: astro-components-mcp-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "mcp:dev"]
    profiles:
      - mcp

