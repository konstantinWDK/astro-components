<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <filter id="galaxyGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="rotate(-15, 32, 32)" filter="url(#galaxyGlow)">
    <!-- Elliptical galaxy body -->
    <ellipse cx="32" cy="32" rx="26" ry="12" fill="url(#galaxyGrad)" opacity="0.15"/>
    <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="url(#galaxyGrad)" stroke-width="1.5"/>
    
    <!-- Inner spiral rings -->
    <ellipse cx="32" cy="32" rx="16" ry="7" fill="none" stroke="url(#galaxyGrad)" stroke-width="1" opacity="0.6"/>
    <ellipse cx="32" cy="32" rx="8" ry="3" fill="none" stroke="url(#galaxyGrad)" stroke-width="0.8" opacity="0.4"/>

    <!-- Center glow -->
    <circle cx="32" cy="32" r="3" fill="url(#galaxyGrad)"/>

    <!-- Spiral arms -->
    <path d="M32,30 C38,28 42,30 40,34" fill="none" stroke="url(#galaxyGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32,34 C26,36 22,34 24,30" fill="none" stroke="url(#galaxyGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M34,28 C38,24 42,26 40,30" fill="none" stroke="url(#galaxyGrad)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M30,36 C26,40 22,38 24,34" fill="none" stroke="url(#galaxyGrad)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- Stars scattered -->
    <circle cx="12" cy="24" r="1.5" fill="url(#galaxyGrad)" opacity="0.6"/>
    <circle cx="48" cy="22" r="1" fill="url(#galaxyGrad)" opacity="0.5"/>
    <circle cx="8" cy="38" r="1" fill="url(#galaxyGrad)" opacity="0.4"/>
    <circle cx="54" cy="40" r="1.2" fill="url(#galaxyGrad)" opacity="0.5"/>
    <circle cx="22" cy="16" r="0.8" fill="url(#galaxyGrad)" opacity="0.3"/>
    <circle cx="42" cy="48" r="0.8" fill="url(#galaxyGrad)" opacity="0.3"/>
  </g>
</svg>
