<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.9"/>
      <stop offset="20%" style="stop-color:#d4a017;stop-opacity:0.6"/>
      <stop offset="60%" style="stop-color:#b8860b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="particleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#d4a017;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="armGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep background glow -->
  <ellipse cx="250" cy="150" rx="200" ry="120" fill="url(#coreGlow)" opacity="0.3" filter="url(#bigGlow)"/>

  <!-- Galaxy outer ellipse -->
  <ellipse cx="250" cy="150" rx="220" ry="80" fill="none" stroke="url(#particleGrad)" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="250" cy="150" rx="190" ry="65" fill="none" stroke="url(#particleGrad)" stroke-width="0.8" opacity="0.2"/>
  <ellipse cx="250" cy="150" rx="160" ry="50" fill="none" stroke="url(#particleGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Spiral arms - rotating group -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 250 150" to="360 250 150" dur="60s" repeatCount="indefinite"/>

    <!-- Main spiral arm 1 -->
    <path d="M250,150 Q290,130 330,120 Q370,110 400,115 Q430,120 440,135" fill="none" stroke="url(#armGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M250,150 Q210,170 170,180 Q130,190 100,185 Q70,180 60,165" fill="none" stroke="url(#armGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Secondary spiral arm 2 -->
    <path d="M250,150 Q280,100 320,80 Q360,60 390,55 Q420,50 440,60" fill="none" stroke="url(#armGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M250,150 Q220,200 180,220 Q140,240 110,245 Q80,250 60,240" fill="none" stroke="url(#armGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Tertiary spiral arm 3 -->
    <path d="M250,150 Q310,150 360,155 Q400,160 430,175" fill="none" stroke="url(#armGrad)" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
    <path d="M250,150 Q190,150 140,145 Q100,140 70,125" fill="none" stroke="url(#armGrad)" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

    <!-- Particles along spiral arms -->
    <circle cx="280" cy="135" r="3" fill="url(#particleGrad)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="118" r="2.5" fill="url(#particleGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="115" r="2" fill="url(#particleGrad)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="178" r="2.8" fill="url(#particleGrad)" opacity="0.65">
      <animate attributeName="opacity" values="0.65;0.25;0.65" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="188" r="2" fill="url(#particleGrad)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="175" r="1.5" fill="url(#particleGrad)" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Particles on arm 2 -->
    <circle cx="300" cy="95" r="2.5" fill="url(#particleGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="62" r="2" fill="url(#particleGrad)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="210" r="2.2" fill="url(#particleGrad)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.18;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="240" r="1.8" fill="url(#particleGrad)" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="245" r="1.5" fill="url(#particleGrad)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Counter-rotating inner group -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 250 150" to="0 250 150" dur="40s" repeatCount="indefinite"/>

    <!-- Inner ellipses -->
    <ellipse cx="250" cy="150" rx="120" ry="35" fill="none" stroke="url(#particleGrad)" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="250" cy="150" rx="90" ry="25" fill="none" stroke="url(#particleGrad)" stroke-width="1" opacity="0.4"/>
    <ellipse cx="250" cy="150" rx="60" ry="18" fill="none" stroke="url(#particleGrad)" stroke-width="0.8" opacity="0.5"/>

    <!-- Inner particles -->
    <circle cx="300" cy="145" r="2" fill="url(#particleGrad)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="140" r="1.5" fill="url(#particleGrad)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="158" r="1.8" fill="url(#particleGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="155" r="1.2" fill="url(#particleGrad)" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="165" r="1.5" fill="url(#particleGrad)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="140" r="1.3" fill="url(#particleGrad)" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbiting particles - outer ring -->
  <g filter="url(#glow)">
    <circle r="3.5" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.65;0.22;0.65" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="url(#particleGrad)">
      <animateMotion dur="20s" repeatCount="indefinite" path="M250,70 A220,80 0 1 1 249.9,70"/>
      <animate attributeName="opacity" values="0.55;0.18;0.55" dur="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbiting particles - middle ring -->
  <g filter="url(#glow)">
    <circle r="3" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.65;0.25;0.65" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.7;0.28;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#particleGrad)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M250,95 A180,55 0 1 1 249.9,95"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbiting particles - inner ring -->
  <g filter="url(#glow)">
    <circle r="2.5" fill="url(#particleGrad)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M250,115 A130,35 0 1 1 249.9,115"/>
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#particleGrad)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M250,115 A130,35 0 1 1 249.9,115"/>
      <animate attributeName="opacity" values="0.7;0.28;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.2" fill="url(#particleGrad)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M250,115 A130,35 0 1 1 249.9,115"/>
      <animate attributeName="opacity" values="0.75;0.3;0.75" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="url(#particleGrad)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M250,115 A130,35 0 1 1 249.9,115"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#particleGrad)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M250,115 A130,35 0 1 1 249.9,115"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Counter-rotating outer particles -->
  <g filter="url(#glow)">
    <circle r="2" fill="url(#particleGrad)">
      <animateMotion dur="25s" repeatCount="indefinite" path="M250,70 A220,80 0 1 0 249.9,70"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#particleGrad)">
      <animateMotion dur="25s" repeatCount="indefinite" path="M250,70 A220,80 0 1 0 249.9,70"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="url(#particleGrad)">
      <animateMotion dur="18s" repeatCount="indefinite" path="M250,95 A180,55 0 1 0 249.9,95"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" fill="url(#particleGrad)">
      <animateMotion dur="18s" repeatCount="indefinite" path="M250,95 A180,55 0 1 0 249.9,95"/>
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center core - multiple pulsing layers -->
  <g filter="url(#bigGlow)">
    <ellipse cx="250" cy="150" rx="45" ry="15" fill="url(#coreGlow)">
      <animate attributeName="rx" values="45;50;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="15;17;15" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="250" cy="150" rx="30" ry="10" fill="url(#coreGlow)" opacity="0.8">
      <animate attributeName="rx" values="30;35;30" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="250" cy="150" r="8" fill="#fef3c7" opacity="0.9">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="150" r="4" fill="#fef3c7">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling stars around center -->
  <g filter="url(#glow)">
    <circle cx="230" cy="142" r="2.5" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="158" r="2" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="160" r="1.8" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.6;0.18;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="142" r="2.2" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.75;0.28;0.75" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="150" r="1.5" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="150" r="1.8" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="138" r="1.5" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="162" r="1.2" fill="url(#particleGrad)">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Random floating background particles -->
  <g opacity="0.3">
    <circle cx="80" cy="60" r="1.5" fill="url(#particleGrad)">
      <animate attributeName="cy" values="60;55;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="80" r="1.5" fill="url(#particleGrad)">
      <animate attributeName="cy" values="80;85;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.08;0.25" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="240" r="1.2" fill="url(#particleGrad)">
      <animate attributeName="cy" values="240;235;240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.06;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="220" r="1.3" fill="url(#particleGrad)">
      <animate attributeName="cy" values="220;215;220" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.07;0.22" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="50" r="1" fill="url(#particleGrad)">
      <animate attributeName="cy" values="50;55;50" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.05;0.18" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="250" r="1.2" fill="url(#particleGrad)">
      <animate attributeName="cy" values="250;245;250" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.06;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="1" fill="url(#particleGrad)">
      <animate attributeName="cx" values="60;65;60" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="150" r="1" fill="url(#particleGrad)">
      <animate attributeName="cx" values="440;435;440" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting star effect -->
  <g filter="url(#glow)">
    <circle r="2" fill="#fef3c7" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="0s"/>
      <animateMotion dur="5s" repeatCount="indefinite" begin="0s" path="M50,30 Q200,100 450,270"/>
    </circle>
    <circle r="1.5" fill="#fef3c7" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite" begin="2.5s"/>
      <animateMotion dur="6s" repeatCount="indefinite" begin="2.5s" path="M450,50 Q250,150 50,250"/>
    </circle>
  </g>
</svg>
