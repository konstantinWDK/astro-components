<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130">
  <defs>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.9"/>
      <stop offset="30%" style="stop-color:#d4a017;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0"/>
    </radialGradient>
    <filter id="gGlowF">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Galaxy background - left side, close to text -->
  <g transform="translate(5, 20)" filter="url(#gGlowF)">
    <!-- Core glow -->
    <ellipse cx="65" cy="55" rx="40" ry="16" fill="url(#gGlow)">
      <animate attributeName="rx" values="40;44;40" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Rotating ellipses -->
    <ellipse cx="65" cy="55" rx="55" ry="20" fill="none" stroke="url(#txtGrad)" stroke-width="0.5" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0 65 55" to="360 65 55" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="65" cy="55" rx="42" ry="14" fill="none" stroke="url(#txtGrad)" stroke-width="0.7" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 65 55" to="0 65 55" dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Core pulse -->
    <circle cx="65" cy="55" r="5" fill="#fef3c7" opacity="0.8">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Twinkling stars near core -->
    <circle cx="52" cy="48" r="2" fill="url(#txtGrad)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="58" r="1.5" fill="url(#txtGrad)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="64" r="1.2" fill="url(#txtGrad)" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="44" r="1.8" fill="url(#txtGrad)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.18;0.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting particles - outer -->
    <circle r="2.5" fill="url(#txtGrad)" opacity="0.7">
      <animateMotion dur="8s" repeatCount="indefinite" path="M65,35 A55,20 0 1 1 64.9,35"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#txtGrad)" opacity="0.5">
      <animateMotion dur="8s" repeatCount="indefinite" path="M65,35 A55,20 0 1 1 64.9,35"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="url(#txtGrad)" opacity="0.6">
      <animateMotion dur="10s" repeatCount="indefinite" path="M65,35 A55,20 0 1 0 64.9,35"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting particles - middle -->
    <circle r="2" fill="url(#txtGrad)" opacity="0.65">
      <animateMotion dur="6s" repeatCount="indefinite" path="M65,42 A42,14 0 1 1 64.9,42"/>
      <animate attributeName="opacity" values="0.65;0.2;0.65" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#txtGrad)" opacity="0.45">
      <animateMotion dur="6s" repeatCount="indefinite" path="M65,42 A42,14 0 1 1 64.9,42"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#txtGrad)" opacity="0.5">
      <animateMotion dur="8s" repeatCount="indefinite" path="M65,42 A42,14 0 1 0 64.9,42"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting particles - inner -->
    <circle r="2" fill="url(#txtGrad)" opacity="0.7">
      <animateMotion dur="4s" repeatCount="indefinite" path="M65,48 A28,10 0 1 1 64.9,48"/>
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" fill="url(#txtGrad)" opacity="0.45">
      <animateMotion dur="4s" repeatCount="indefinite" path="M65,48 A28,10 0 1 1 64.9,48"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#txtGrad)" opacity="0.55">
      <animateMotion dur="5s" repeatCount="indefinite" path="M65,48 A28,10 0 1 0 64.9,48"/>
      <animate attributeName="opacity" values="0.55;0.18;0.55" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text: Astro Kit -->
  <text x="135" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="url(#txtGrad)">
    Astro Kit
  </text>

  <!-- Text: Components -->
  <text x="135" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="url(#txtGrad)" opacity="0.85">
    Components
  </text>
</svg>
