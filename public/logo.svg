<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="30,4 52,16 52,40 30,52 8,40 8,16" fill="url(#logoGrad)" opacity="0.1" filter="url(#glow)"/>
  <polygon points="30,4 52,16 52,40 30,52 8,40 8,16" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>

  <!-- Inner hexagon -->
  <polygon points="30,14 42,20 42,36 30,42 18,36 18,20" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="30" cy="28" r="4" fill="url(#logoGrad)" filter="url(#glow)"/>

  <!-- Connection lines -->
  <line x1="30" y1="4" x2="30" y2="14" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>
  <line x1="52" y1="16" x2="42" y2="20" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>
  <line x1="52" y1="40" x2="42" y2="36" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>
  <line x1="30" y1="52" x2="30" y2="42" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>
  <line x1="8" y1="40" x2="18" y2="36" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>
  <line x1="8" y1="16" x2="18" y2="20" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.25"/>

  <!-- Subtle inner details -->
  <polygon points="30,22 34,24 34,32 30,34 26,32 26,24" fill="url(#logoGrad)" opacity="0.15"/>
</svg>
