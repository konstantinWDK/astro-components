name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registry integrity (source() paths exist)
        run: node scripts/check-registry.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build docs site
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run
